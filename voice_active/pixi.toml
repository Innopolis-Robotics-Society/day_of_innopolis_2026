[workspace]
channels = ["conda-forge"]
name = "Манипулятор_хихихаха"
platforms = ["linux-64", "win-64"]
version = "0.1.1"

[dependencies]
python = ">=3.14.5,<3.15"
soxr = ">=0.1.3,<0.2"

[target.linux-64.dependencies]
portaudio = ">=19.7.0,<20"
pyaudio = ">=0.2.14,<0.3"

[target.win-64.pypi-dependencies]
pyaudio = ">=0.2.14"

[pypi-dependencies]
vosk = ">=0.3.45, <0.4"
sounddevice = ">=0.5.5, <0.6"
soxr = ">=1.1.0, <2"